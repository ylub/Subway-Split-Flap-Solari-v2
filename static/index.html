<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GTFS Solari</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="plugins/lirr/custom.css">
  </head>
  <body>
    <div id="board" class="chartContainer splitflap">
      <div class="topbar">
        <div>
          <p id="feed-title" class="eyebrow">Long Island Rail Road</p>
          <h1 id="station-title">Jamaica</h1>
        </div>
        <form id="station-form" class="station-form">
          <select id="feed-select" aria-label="Transit feed"></select>
          <input id="station-input" list="stations" value="Jamaica" aria-label="Station">
          <datalist id="stations"></datalist>
          <button type="submit">Set</button>
        </form>
      </div>

      <div class="header badge-head"></div>
      <div class="header branch-head">Line</div>
      <div class="header destination-head">Destination</div>
      <div class="header scheduled-head">Time</div>
      <div class="header minutes-head">Min</div>
      <div class="header remarks-head">Remarks</div>

      <script type="text/template" id="row_template">
        <div class="row">
          <div class="group linecolor"><div class="line-swatch"></div></div>

          <div class="group branch">
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div>
          </div>

          <div class="group destination">
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
          </div>

          <div class="group scheduled">
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
          </div>

          <div class="group minutes">
            <div class="number"><span></span></div><div class="number"><span></span></div><div class="number"><span></span></div>
          </div>

          <div class="group remarks">
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
            <div class="full"><span></span></div><div class="full"><span></span></div><div class="full"><span></span></div>
          </div>

          <div class="group status">
            <div class="sA"></div>
            <div class="sB"></div>
          </div>
        </div>
      </script>
    </div>

    <script src="vendor/jquery.js"></script>
    <script src="vendor/underscore-min.js"></script>
    <script src="vendor/backbone-min.js"></script>
    <script src="js/split-flap.js"></script>
    <script src="plugins/lirr/custom.js"></script>
    <script>
      sf.options = {
        plugin: 'lirr',
        container: $('#board'),
        template: $('#row_template'),
        numRows: 12,
        sort: 'minutes',
        order: 'asc',
        maxResults: 12,
        pageInterval: 30000,
        stagger: 160
      };

      const feedSelect = document.getElementById('feed-select');
      const stationInput = document.getElementById('station-input');
      const stationsList = document.getElementById('stations');
      const feedTitle = document.getElementById('feed-title');
      const params = new URLSearchParams(window.location.search);

      function loadStations(feed, nextStation) {
        return fetch('/api/stations?feed=' + encodeURIComponent(feed))
          .then(response => response.json())
          .then(data => {
            stationsList.replaceChildren(...data.stations.map(station => {
              const option = document.createElement('option');
              option.value = station.stop_name;
              option.label = station.stop_code;
              return option;
            }));
            feedTitle.textContent = data.feed.label;
            stationInput.value = nextStation || data.feed.default_station;
          });
      }

      function setUrl(feed, station) {
        const url = new URL(window.location);
        url.searchParams.set('feed', feed);
        url.searchParams.set('station', station);
        history.replaceState(null, '', url);
      }

      fetch('/api/feeds')
        .then(response => response.json())
        .then(data => {
          feedSelect.replaceChildren(...data.feeds.map(feed => {
            const option = document.createElement('option');
            option.value = feed.key;
            option.textContent = feed.label;
            return option;
          }));

          const initialFeed = params.get('feed') || 'lirr';
          const initialStation = params.get('station');
          feedSelect.value = initialFeed;
          return loadStations(initialFeed, initialStation);
        })
        .then(() => {
          sf.board.init(sf.options);
          sf.items.init(sf.options);
          sf.items.load(sf.options);
        });

      feedSelect.addEventListener('change', function() {
        loadStations(feedSelect.value).then(() => {
          setUrl(feedSelect.value, stationInput.value);
          items.url = sf.plugins.lirr.url(sf.options);
          items.update(sf.options);
        });
      });

      $(document).ready(function() {
      });
    </script>
  </body>
</html>
